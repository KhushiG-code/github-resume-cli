[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-resume"
version = "0.1.0"
description = "Terminal-based resume generator built from a GitHub profile"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
]

[project.scripts]
gh-resume = "gh_resume.cli:main"

[tool.setuptools]
packages = ["gh_resume"]

[tool.setuptools.package-data]
gh_resume = ["fixtures/*.json"]
